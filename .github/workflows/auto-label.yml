name: Auto Label Issues
on:
  issues:
    types: [opened]

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - uses: github/issue-labeler@v3
        with:
          configuration-path: .github/issue-labeler.yml
          sync-labels: false
          enable-statistics: false
          repo-token: ${{ secrets.GITHUB_TOKEN }}
